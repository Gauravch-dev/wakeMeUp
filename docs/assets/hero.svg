    <text x="44" y="132" fill="#183C2F" font-size="58" font-weight="700" letter-spacing="-3">wakemeup</text>
    <text x="46" y="176" fill="#2E5D43" font-size="24" font-weight="600">Your stop, not a stopwatch.</text>
    <text x="46" y="218" fill="#626A61" font-size="17">Choose your journey. Track your route.</text>
    <text x="46" y="245" fill="#626A61" font-size="17">Wake one station before your destination.</text>
    <text x="46" y="302" fill="#626A61" font-size="11" letter-spacing="0.5">KOTLIN / JETPACK COMPOSE / LOCATION-AWARE ALARMS</text>
