<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">wakemeup — Your stop, not a stopwatch.</title>
  <desc id="desc">A branded illustration of a train approaching Sanpada on a Panvel to Vashi journey. The wake-up point is one station before Vashi. This is an illustration, not an app screenshot.</desc>
  <rect width="1200" height="340" rx="24" fill="#F9F6EF"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#DDDCD2" stroke-width="2"/>
